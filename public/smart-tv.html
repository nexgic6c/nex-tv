<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>X-Stream Engine Ultra Supremo</title>

<!-- SUPORTE A STREAMING HLS (M3U8 / LIVES / IPTV) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

#mediaVideo {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; 
    object-fit: contain;
    z-index: 10;
    transform: translateZ(0);
    will-change: transform;
}

#mediaImage {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; object-fit: contain;
    display: none; z-index: 15;
}

#brandLogo {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    height: 24px;
    width: auto;
    object-fit: contain;
    pointer-events: none;
}
</style>
</head>

<body>

<img id="brandLogo" src="logo.png">

<video id="mediaVideo" autoplay playsinline webkit-playsinline preload="auto"></video>
<img id="mediaImage">

<script>
// ==========================================
// CONFIGURAÇÃO DOS LINKS DO STANDBY
// ==========================================
var STANDBY_VIDEO_URL = "https://pub-a384c7ff61e54479b2bc601c3930cded.r2.dev/wallpaper/standby_video.mp4";
// ==========================================

var SERVER_URL = (window.location.origin && window.location.origin.startsWith("http"))
    ? window.location.origin 
    : "https://x-stream-56ya.onrender.com";

var wsProtocol = SERVER_URL.startsWith("https") ? "wss://" : "ws://";
var WS_URL = wsProtocol + SERVER_URL.replace(/^https?:\/\//, '');

var mediaVideo = document.getElementById("mediaVideo");
var mediaImage = document.getElementById("mediaImage");

var urlAtual = "";
var hlsPlayer = null;
var tempoInicialAjustado = false;
var ultimoComandoIdProcessado = 0;
var emModoStandbyAnterior = false;

function limparMidia() {
    tempoInicialAjustado = false;
    if (hlsPlayer) {
        try {
            hlsPlayer.destroy();
            hlsPlayer = null;
        } catch(e){}
    }
    try {
        mediaVideo.pause();
        mediaVideo.removeAttribute("src");
        mediaVideo.load();
    } catch(e){}
    try {
        mediaImage.removeAttribute("src");
    } catch(e){}
}

function receberMidia(url, tempoInicial, isStandby) {
    if (!url) {
        urlAtual = "";
        limparMidia();
        mediaVideo.style.display = "none";
        mediaImage.style.display = "none";
        return;
    }

    if (url === urlAtual && emModoStandbyAnterior === isStandby) return;
    urlAtual = url;
    emModoStandbyAnterior = isStandby;
    limparMidia();

    mediaImage.style.display = "none";
    mediaVideo.style.display = "block";

    if (isStandby) {
        mediaVideo.muted = true; // Standby roda mudo por segurança
        mediaVideo.loop = true;
        mediaVideo.src = STANDBY_VIDEO_URL;
        mediaVideo.load();
        mediaVideo.play().catch(function(){});
        return;
    }

    // Mídia normal: Áudio habilitado obrigatoriamente
    mediaVideo.muted = false;
    mediaVideo.loop = false;

    var urlLimpa = url.split('?')[0].toLowerCase();
    if (urlLimpa.endsWith('.m3u8')) {
        tentarHLS(url, tempoInicial);
    } else {
        tentarVideo(url, tempoInicial);
    }
}

function tentarHLS(url, tempoInicial) {
    if (Hls.isSupported()) {
        hlsPlayer = new Hls({
            enableWorker: false,
            lowLatencyMode: false,
            maxBufferLength: 15,
            maxMaxBufferLength: 30
        });
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(mediaVideo);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
            iniciarVideo(tempoInicial);
        });
        hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) { tentarVideo(url, tempoInicial); }
        });
    } else {
        mediaVideo.src = url;
        tentarVideo(url, tempoInicial);
    }
}

function tentarVideo(url, tempoInicial) {
    mediaVideo.src = url;
    mediaVideo.load();
    iniciarVideo(tempoInicial);
}

function iniciarVideo(tempoInicial) {
    if (tempoInicial && !tempoInicialAjustado) {
        try { mediaVideo.currentTime = Number(tempoInicial); } catch(e){}
        tempoInicialAjustado = true;
    }

    var tentativa = mediaVideo.play();
    if (tentativa !== undefined) {
        tentativa.catch(function() {
            // Tenta reproduzir forçando mudo temporário se o navegador bloquear o autoplay com áudio, depois reativa
            mediaVideo.muted = true;
            mediaVideo.play().then(function() {
                setTimeout(function() {
                    if (!emModoStandbyAnterior) mediaVideo.muted = false;
                }, 500);
            }).catch(function(){});
        });
    }
}

function aplicarEstado(dados) {
    var isStandby = dados.modoStandby === true;
    var url = "";

    if (isStandby) {
        url = STANDBY_VIDEO_URL;
    } else {
        if (dados.fila && dados.fila.length > 0 && dados.fila[dados.atual]) {
            url = dados.fila[dados.atual].url || dados.fila[dados.atual];
        }
        if (!url && dados.video) { url = dados.video; }
    }

    if (url) {
        receberMidia(url, dados.currentTime || 0, isStandby);
    } else {
        if (urlAtual !== "") {
            urlAtual = "";
            limparMidia();
            mediaVideo.style.display = "none";
        }
    }

    if (mediaVideo && !isStandby) {
        var isPlaying = (dados.playing !== undefined) ? dados.playing : dados.reproduzindo;

        if (isPlaying === false && !mediaVideo.paused) {
            mediaVideo.pause();
        } else if (isPlaying === true && mediaVideo.paused) {
            mediaVideo.play().catch(function(){});
        }

        if (dados.volume !== undefined) { mediaVideo.volume = dados.volume / 100; }
        if (dados.mudo !== undefined) { mediaVideo.muted = dados.mudo; }

        if (dados.comandoId && dados.comandoId !== ultimoComandoIdProcessado) {
            ultimoComandoIdProcessado = dados.comandoId;

            if (dados.ultimoComando === 'forward' || dados.ultimoComando === '+15') {
                mediaVideo.currentTime = Math.min(mediaVideo.duration || 0, mediaVideo.currentTime + 15);
            } else if (dados.ultimoComando === 'rewind' || dados.ultimoComando === '-15') {
                mediaVideo.currentTime = Math.max(0, mediaVideo.currentTime - 15);
            } else if (dados.currentTime !== undefined && Math.abs(mediaVideo.currentTime - dados.currentTime) > 2) {
                mediaVideo.currentTime = dados.currentTime;
            }
        }
    }
}

function conectarWebSocket() {
    var ws = new WebSocket(WS_URL);
    ws.onmessage = function(event) {
        try {
            var dados = JSON.parse(event.data);
            aplicarEstado(dados);
        } catch(e){}
    };
    ws.onclose = function() {
        setTimeout(conectarWebSocket, 3000);
    };
}
conectarWebSocket();

function verificarServidor() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", SERVER_URL + "/status?t=" + Date.now(), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var dados = JSON.parse(xhr.responseText);
                    aplicarEstado(dados);
                } catch(e){}
            }
            setTimeout(verificarServidor, 4000); // Intervalo levemente maior para poupar recursos da TV
        }
    };
    xhr.onerror = function() {
        setTimeout(verificarServidor, 4000);
    };
    xhr.send();
}
verificarServidor();

mediaVideo.onended = function() {
    if (!emModoStandbyAnterior) {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", SERVER_URL + "/controle", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify({ slink: "next" }));
    }
};
</script>

</body>
</html>
